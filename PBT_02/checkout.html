<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán giỏ hàng</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        tfoot { font-weight: bold; background-color: #f9f9f9; }
        fieldset { margin-bottom: 20px; border: 1px solid #ccc; padding: 15px; }
        .form-group { margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>Hoàn tất đơn hàng</h2>
    <div class="form-group">
        <label for="search_product">Tìm thêm sản phẩm:</label>
        <input list="product_list" id="search_product" name="search_product" placeholder="Gõ để tìm kiếm...">
        <datalist id="product_list">
            <option value="Ốp lưng iPhone 16">
            <option value="Sạc nhanh 20W">
            <option value="Kính cường lực">
        </datalist>
    </div>

    <div class="form-group">
        <label for="loyalty_points">Điểm tích lũy hạng Gold:</label>
        <meter id="loyalty_points" value="75" min="0" max="100" low="30" high="80" optimum="90" title="75/100 điểm">75%</meter>
    </div>

    <form action="#" method="POST">
        <h3>1. Chi tiết giỏ hàng</h3>
        <table>
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Sản phẩm</th>
                    <th>Đơn giá</th>
                    <th>Số lượng</th>
                    <th>Thành tiền</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Bàn phím cơ</td>
                    <td>1,200,000đ</td>
                    <td>1</td>
                    <td>1,200,000đ</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Chuột không dây</td>
                    <td>500,000đ</td>
                    <td>2</td>
                    <td>1,000,000đ</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Lót chuột cỡ lớn</td>
                    <td>150,000đ</td>
                    <td>1</td>
                    <td>150,000đ</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="4" style="text-align: right;">Tổng cộng:</td>
                    <td><output name="total_price" for="price quantity">2,350,000đ</output></td>
                </tr>
            </tfoot>
        </table>

        <fieldset>
            <legend>2. Phương thức thanh toán</legend>
            <div class="form-group">
                <input type="radio" id="pay_cod" name="payment_method" value="cod" required>
                <label for="pay_cod">Thanh toán khi nhận hàng (COD)</label>
            </div>
            <div class="form-group">
                <input type="radio" id="pay_transfer" name="payment_method" value="transfer">
                <label for="pay_transfer">Chuyển khoản ngân hàng</label>
            </div>
            <div class="form-group">
                <input type="radio" id="pay_wallet" name="payment_method" value="wallet">
                <label for="pay_wallet">Ví điện tử (Momo, ZaloPay)</label>
            </div>

            <div class="form-group" style="margin-top: 15px;">
                <label for="discount_code">Mã giảm giá:</label>
                <input type="text" id="discount_code" name="discount_code" pattern="^SALE\d{4}$" placeholder="VD: SALE2026" title="Mã phải có định dạng SALE + 4 chữ số, ví dụ SALE2026">
            </div>

            <div class="form-group">
                <label for="order_note" style="display: block;">Ghi chú (Tùy chọn):</label>
                <textarea id="order_note" name="order_note" rows="3" cols="40" placeholder="Ghi chú về việc giao hàng..."></textarea>
            </div>
        </fieldset>

        <fieldset>
            <legend>3. Thông tin giao hàng</legend>
            <div class="form-group">
                <label for="delivery_date">Ngày giao mong muốn:</label>
                <input type="date" id="delivery_date" name="delivery_date" min="2026-04-26" required>
            </div>

            <div class="form-group">
                <label for="delivery_time">Khung giờ giao hàng:</label>
                <select id="delivery_time" name="delivery_time" required>
                    <option value="" disabled selected>-- Chọn khung giờ --</option>
                    <option value="morning">Sáng 8-12h</option>
                    <option value="afternoon">Chiều 14-18h</option>
                    <option value="evening">Tối 18-21h</option>
                </select>
            </div>

            <div class="form-group">
                <label for="delivery_duration">Thời gian giao hàng tiêu chuẩn:</label>
                <br>
                1 <input type="range" id="delivery_duration" name="delivery_duration" min="1" max="7" step="1" value="3"> 
            </div>
        </fieldset>

        <button type="submit" aria-label="Xác nhận đặt hàng">Đặt hàng ngay</button>
    </form>

</body>
</html>
