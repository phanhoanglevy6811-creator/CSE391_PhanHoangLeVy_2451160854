<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản phẩm của chúng tôi</title>
</head>
<body>
    <header>
        <svg width="50" height="50" xmlns="http://www.w3.org/2000/svg" aria-label="Logo Công Ty">
            <rect width="50" height="50" rx="10" fill="#007BFF" />
            <circle cx="25" cy="25" r="15" fill="#FFFFFF" />
        </svg>
        <h1>Giới thiệu sản phẩm công nghệ</h1>
    </header>

    <main>
        <section>
            <h2>Thư viện hình ảnh</h2>
            <figure>
                <img src="laptop.jpg" alt="Laptop Gaming viền mỏng màn hình 144Hz" style="max-width: 100%; height: auto;" loading="lazy">
                <figcaption>Laptop Gaming thế hệ mới - Hiệu năng vượt trội</figcaption>
            </figure>
            
            <figure>
                <img src="smartphone.webp" alt="Smartphone camera kép siêu nét màu đen" style="max-width: 100%; height: auto;" loading="lazy">
                <figcaption>Smartphone X - Chụp ảnh ban đêm đỉnh cao</figcaption>
            </figure>
            
            <figure>
                <img src="headphone.jpg" alt="Tai nghe over-ear chống ồn chủ động màu trắng" style="max-width: 100%; height: auto;" loading="lazy">
                <figcaption>Tai nghe Bluetooth - Chống ồn tuyệt đối</figcaption>
            </figure>
        </section>

        <section>
            <h2>Video Review Sản Phẩm</h2>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </section>

        <section>
            <h2>Hướng dẫn sử dụng</h2>
            <video controls poster="video-thumbnail.jpg" width="560">
                <source src="huong-dan.mp4" type="video/mp4">
                <source src="huong-dan.webm" type="video/webm"> 
            </video>
        </section>

        <section>
            <h2>Nhạc nền thư giãn</h2>
            <audio controls>
                <source src="background-music.mp3" type="audio/mpeg">
                <source src="background-music.ogg" type="audio/ogg">
            </audio>
        </section>
    </main>
</body>
</html>
