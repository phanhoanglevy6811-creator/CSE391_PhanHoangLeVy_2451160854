<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý danh sách sản phẩm</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container py-4">

    <div class="header">
        <h2>Quản lý danh sách sản phẩm</h2>
        <p>Giao diện nhập liệu và hiển thị danh sách sản phẩm một cách trực quan, rõ ràng.</p>
    </div>

    <div class="row">

        <div class="col-lg-5">
            <div class="card custom-card">

                <div class="card-header">
                    <h5>Thêm sản phẩm mới</h5>
                    <small>Nhập đầy đủ thông tin để thêm sản phẩm vào danh sách.</small>
                </div>

                <div class="card-body">

                    <div class="mb-3">
                        <label class="form-label">Tên sản phẩm</label>
                        <input type="text" class="form-control" placeholder="Nhập tên sản phẩm">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Danh mục</label>
                        <select class="form-select">
                            <option>-- Chọn danh mục --</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Giá</label>
                        <input type="text" class="form-control" placeholder="Nhập giá">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Trạng thái còn hàng</label>
                        <select class="form-select">
                            <option>Còn hàng</option>
                            <option>Hết hàng</option>
                        </select>
                    </div>

                    <div class="d-flex gap-2">
                        <button class="btn btn-primary flex-grow-1">
                            Thêm sản phẩm
                        </button>

                        <button class="btn btn-outline-secondary">
                            Làm mới form
                        </button>
                    </div>

                </div>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="card custom-card">

                <div class="card-header">
                    <h5>Danh sách sản phẩm</h5>
                    <small>Danh sách sản phẩm mẫu được hiển thị từ dữ liệu hệ thống.</small>
                </div>

                <div class="card-body">

                    <table class="table">
                        <thead>
                            <tr>
                                <th>STT</th>
                                <th>TÊN SẢN PHẨM</th>
                                <th>DANH MỤC</th>
                                <th>GIÁ</th>
                                <th>TRẠNG THÁI</th>
                            </tr>
                        </thead>

                        <!-- <tbody id="productList"></tbody> -->
                    </table>

                </div>

            </div>
        </div>

    </div>

</div>
<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="data/data.js"></script>

</body>
</html>
