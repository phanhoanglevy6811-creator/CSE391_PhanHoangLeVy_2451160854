<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard APIs</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <div class="container">

        <h1>API Dashboard</h1>

        <div class="top-bar">
            <button id="refreshBtn">Refresh All</button>
            <span id="loadTime"></span>
        </div>

        <div id="globalLoading" class="loading">
            Loading all data...
        </div>

        <div class="dashboard">

            <div class="card">
                <h2>Users API</h2>
                <div id="widget1"></div>
            </div>

            <div class="card">
                <h2>Weather API</h2>
                <div id="widget2"></div>
            </div>

            <div class="card">
                <h2>Country API</h2>
                <div id="widget3"></div>
            </div>

        </div>

    </div>

    <script src="./js/app.js"></script>

</body>
</html>
