<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <div class="container">

        <h1>User Directory CRUD</h1>

        <input
            type="text"
            id="searchInput"
            placeholder="Search by name or email..."
        >

        <form id="userForm">

            <input
                type="text"
                id="name"
                placeholder="Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <button type="submit">
                Save User
            </button>

        </form>

        <div id="toast"></div>

        <div id="loader"></div>

        <div id="userList"></div>

    </div>

    <script src="./js/api.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/app.js"></script>

</body>
</html>
