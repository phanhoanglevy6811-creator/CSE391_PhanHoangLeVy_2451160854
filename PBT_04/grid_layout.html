<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Grid Layout</title>
    <link rel="stylesheet" href="grid.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>MyShop</h1>
            <nav>
                <a href="#">Home</a>
                <a href="#">Products</a>
                <a href="#">Sale</a>
                <a href="#">Contact</a>
            </nav>
        </header>
        <section class="hero">
            <div class="hero-text">
                <h2>Summer Collection 2026</h2>
                <p>
                    Giảm giá tới 50% cho các sản phẩm mới nhất
                </p>
                <button>Shop Now</button>
            </div>
            <div class="featured-product">
                <img 
                    src="https://i1-c.pinimg.com/736x/18/dd/ee/18ddee2bf57b8242ad5bfd9c1e6aaffe.jpg" 
                    alt=""
                >
                <h3>Featured Product</h3>
                <p>Best Seller</p>
            </div>
        </section>
        <aside class="sidebar">
            <h3>Filters</h3>
            <label>
                <input type="checkbox">
                Laptop
            </label>
            <label>
                <input type="checkbox">
                Phone
            </label>
            <label>
                <input type="checkbox">
                Gaming
            </label>
            <label>
                <input type="checkbox">
                Accessories
            </label>
            <label>
                <input type="checkbox">
                Smart Watch
            </label>
        </aside>
        <main class="main-content">
            <div class="product-grid">
                <div class="card">
                    <img src="https://i1-c.pinimg.com/1200x/06/2f/8f/062f8fb59723fce92e2a65aa932747b2.jpg" alt="">
                    <h4>Product 1</h4>
                    <p>$120</p>
                </div>
                <div class="card">
                    <img src="https://i1-c.pinimg.com/1200x/2a/de/fb/2adefb09f106b15555f97be84bc3cea3.jpg" alt="">
                    <h4>Product 2</h4>
                    <p>$150</p>
                </div>
                <div class="card">
                    <img src="https://i1-c.pinimg.com/1200x/97/05/7a/97057a4b2ae6d42f788978207bae2701.jpg" alt="">
                    <h4>Product 3</h4>
                    <p>$180</p>
                </div>
                <div class="card">
                    <img src="https://i1-c.pinimg.com/736x/55/89/06/558906777e5a73b6ea21f63b017375ed.jpg" alt="">
                    <h4>Product 4</h4>
                    <p>$210</p>
                </div>
                <div class="card">
                    <img src="https://i1-c.pinimg.com/1200x/f9/3d/10/f93d10641e1c2af67fe0a90b00c07959.jpg" alt="">
                    <h4>Product 5</h4>
                    <p>$260</p>
                </div>
                <div class="card">
                    <img src="https://i1-c.pinimg.com/1200x/e7/ec/19/e7ec19af8afad469179d14101403a2f9.jpg" alt="">
                    <h4>Product 6</h4>
                    <p>$300</p>
                </div>
            </div>
        </main>
        <aside class="ads">

            <h3>Advertisement</h3>

            <img 
                src="https://i1-c.pinimg.com/736x/c3/90/ad/c390adea394d67dd61f5e9d0782d6be4.jpg" 
                alt=""
            >
        </aside>
        <footer class="footer">
            <p>
                © 2026 MyShop. All rights reserved.
            </p>
        </footer>
    </div>
</body>
</html>
