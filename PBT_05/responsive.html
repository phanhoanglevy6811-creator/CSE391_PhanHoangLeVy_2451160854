<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Page</title>
    <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <header class="header">
        <div class="logo">ShopLogo</div>
        <div class="hamburger">☰</div>
        <nav class="nav">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Categories</a>
            <a href="#">Contact</a>
        </nav>
    </header>
    <main class="layout">
        <aside class="sidebar">
            <h3>Filters</h3>
            <select>
                <option>Category</option>
                <option>Phones</option>
                <option>Laptops</option>
            </select>
            <select>
                <option>Price</option>
                <option>$0 - $100</option>
                <option>$100 - $500</option>
            </select>
        </aside>
        <section class="products">
            <div class="product-card">
                <img src="https://picsum.photos/300/200?1" alt="">
                <h3>Product 1</h3>
                <p>$99</p>
                <button>Buy Now</button>
            </div>
            <div class="product-card">
                <img src="https://picsum.photos/300/200?2" alt="">
                <h3>Product 2</h3>
                <p>$120</p>
                <button>Buy Now</button>
            </div>
            <div class="product-card">
                <img src="https://picsum.photos/300/200?3" alt="">
                <h3>Product 3</h3>
                <p>$150</p>
                <button>Buy Now</button>
            </div>
            <div class="product-card">
                <img src="https://picsum.photos/300/200?4" alt="">
                <h3>Product 4</h3>
                <p>$200</p>
                <button>Buy Now</button>
            </div>
            <div class="product-card">
                <img src="https://picsum.photos/300/200?5" alt="">
                <h3>Product 5</h3>
                <p>$89</p>
                <button>Buy Now</button>
            </div>
            <div class="product-card">
                <img src="https://picsum.photos/300/200?6" alt="">
                <h3>Product 6</h3>
                <p>$75</p>
                <button>Buy Now</button>
            </div>
            <div class="product-card">
                <img src="https://picsum.photos/300/200?7" alt="">
                <h3>Product 7</h3>
                <p>$180</p>
                <button>Buy Now</button>
            </div>
            <div class="product-card">
                <img src="https://picsum.photos/300/200?8" alt="">
                <h3>Product 8</h3>
                <p>$220</p>
                <button>Buy Now</button>
            </div>
        </section>
        <aside class="ads">
            <h3>Advertisement</h3>
            <p>Sale 50%</p>
        </aside>
    </main>
    <footer class="footer">
        <p>© 2026 Responsive Product Page</p>
    </footer>
</body>
</html>
